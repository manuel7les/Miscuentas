<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mis Cuentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — summary card, content per tab, bottom tab bar, floating add button, slide-up sheet */

  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1120; --surface:#161C2F; --ink:#E9ECF5; --muted:#9AA3BE; --line:#262E47;
  --accent:#7C93FF; --accent-ink:#0D1120; --hero:#1E2742; --hero-ink:#F2F4FA;
  --in:#3FCB93; --out:#FF7D66; --warn:#E8B04A; --soft:#20283F; --save:#4FD6C2; --save-soft:#173A3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#161C2F; --ink:#E9ECF5; --muted:#9AA3BE; --line:#262E47;
  --accent:#7C93FF; --accent-ink:#0D1120; --hero:#1E2742; --hero-ink:#F2F4FA;
  --in:#3FCB93; --out:#FF7D66; --warn:#E8B04A; --soft:#20283F; --save:#4FD6C2; --save-soft:#173A3A; color-scheme:dark}

[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:16px 120px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:1.1rem}
.month button:hover{background:var(--soft)}
.month span{min-width:110px;text-align:center;font-weight:600;font-size:.92rem}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;opacity:.7}
.hero .big{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;letter-spacing:-.02em;overflow-wrap:anywhere}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split div{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;min-width:0}
.split b{display:block;font-size:1.05rem;font-weight:600;overflow-wrap:anywhere}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.meter i{display:block;height:100%;background:var(--in);border-radius:99px;transition:width .4s}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-size:1.1rem;font-weight:600}
.sec-h .link{border:0;background:none;color:var(--accent);font-weight:600;font-size:.88rem;padding:4px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}

.cat{display:grid;grid-template-columns:36px 1fr auto;gap:4px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.cat:first-child{border-top:0}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--soft);font-size:.78rem;font-weight:700;color:var(--muted);grid-row:span 2}
.cat .nm{font-weight:600;min-width:0}
.cat .amt{font-weight:600;text-align:right}
.bar{grid-column:2/4;height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar i.over{background:var(--out)} .bar i.near{background:var(--warn)}
.cat .sub{grid-column:2/4;font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.chip{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.02em}
.chip.over{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.chip.near{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

.day{padding:8px 14px 4px;font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--soft);display:flex;justify-content:space-between}
.tx{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.tx .nm{min-width:0}
.tx .nm b{display:block;font-weight:600}
.tx .nm span{display:block;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-weight:600;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.pos{color:var(--in)} .neg{color:var(--out)}
.card-tag{display:inline-block;font-style:normal;font-size:.66rem;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:1px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.cardsum{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:14px}
.cardsum .ci{width:40px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--ink)));position:relative}
.cardsum .ci::after{content:"";position:absolute;left:6px;top:8px;width:9px;height:7px;border-radius:2px;background:rgba(255,255,255,.75)}
.cardsum b{display:block;font-weight:600}
.cardsum span{font-size:.8rem;color:var(--muted)}
.cardsum .amt{font-family:var(--display);font-weight:800;font-size:1.15rem}
.split .wide{grid-column:1/3;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sav{color:var(--save)}
.tx .ico.savico{background:var(--save-soft);color:var(--save)}
.savp{padding:16px;display:flex;flex-direction:column;gap:14px}
.savtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.savtop small{display:block;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.savtop .big{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.1;color:var(--save)}
.savtop .acc{text-align:right}
.savtop .acc b{font-family:var(--display);font-size:1.1rem;font-weight:800}
.sbar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:99px;background:var(--save)}
.savmsg{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;color:var(--muted)}
.chip.ok{background:var(--save-soft);color:var(--save)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;padding-top:6px;border-top:1px solid var(--line)}
.mcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.mcol .v{font-size:.68rem;font-weight:700;color:var(--muted);white-space:nowrap}
.mcol .b{width:70%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--save);opacity:.45;min-height:3px}
.mcol.cur .b{opacity:1}
.mcol.cur .v{color:var(--save)}
.mcol .m{font-size:.72rem;color:var(--muted);text-transform:capitalize}
.mcol.cur .m{color:var(--ink);font-weight:700}
.goalrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px}
.goalrow input{width:120px;box-sizing:border-box}
.goalrow .none{font-size:.9rem;color:var(--muted);font-weight:600}
.hbars{padding:16px;display:flex;flex-direction:column;gap:12px}
.hb{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center}
.hb .l{font-size:.85rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{display:flex;align-items:center;gap:8px;min-width:0}
.hb .t i{display:block;height:18px;border-radius:5px;min-width:3px}
.hb .t span{font-size:.78rem;font-weight:700;white-space:nowrap;color:var(--muted)}
.hb.top .l,.hb.top .t span{color:var(--ink)}
.bchart{padding:16px;display:flex;flex-direction:column;gap:14px}
.bc .h{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;margin-bottom:6px}
.bc .h b{font-weight:600}
.bc .h span{color:var(--muted);white-space:nowrap}
.bc .track{position:relative;height:14px;border-radius:7px;background:var(--soft);overflow:hidden}
.bc .track i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--in)}
.bc .track i.near{background:var(--warn)} .bc .track i.over{background:var(--out)}
.bc .pct{font-size:.74rem;font-weight:700;margin-top:4px;color:var(--muted)}
.bc .pct.near{color:var(--warn)} .bc .pct.over{color:var(--out)}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--muted)}
.legend2 span{display:flex;align-items:center;gap:5px}
.legend2 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.actions button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;font-weight:700;font-size:.92rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.actions button b{font-family:var(--display);font-size:1.4rem;line-height:1}
.actions .g{color:var(--out)} .actions .i{color:var(--in)} .actions .a{color:var(--save)}
.legend .lp{font-weight:600;color:var(--muted);font-size:.78rem;margin-left:4px}
.cmpw{padding:16px;display:flex;flex-direction:column;gap:14px}
.cmpsum{font-size:.88rem;color:var(--muted)} .cmpsum b{color:var(--ink)} .cmpsum b.neg{color:var(--out)} .cmpsum b.pos{color:var(--in)}
.cmp .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;font-size:.88rem}
.cmp .ch b{font-weight:600}
.cb{display:flex;align-items:center;gap:8px;height:16px;margin-top:3px}
.cb i{display:block;height:12px;border-radius:4px}
.cb.prev i{background:var(--line);height:8px}
.cb span{font-size:.74rem;font-weight:700;color:var(--ink);white-space:nowrap}
.cb.prev span{color:var(--muted);font-weight:600}
.dchip{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.dchip.up{background:color-mix(in srgb,var(--out) 14%,transparent);color:var(--out)}
.dchip.down{background:color-mix(in srgb,var(--in) 14%,transparent);color:var(--in)}
.dchip.eq{background:var(--soft);color:var(--muted)}
.plan{padding:16px;display:flex;flex-direction:column;gap:14px}
.pv .dchip{font-size:.82rem;padding:5px 12px;white-space:normal;display:inline-block}
.dchip.ok{background:var(--save-soft);color:var(--save)}
.ph{display:flex;justify-content:space-between;gap:8px;font-size:.86rem;margin-bottom:6px}
.ph b{font-weight:600} .ph span{font-weight:700}
.pt{display:flex;height:16px;border-radius:6px;background:var(--soft);overflow:hidden}
.pt i{display:block;height:100%}
.plansum{padding:14px;display:flex;flex-direction:column;gap:8px}
.plansum .r{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.plansum .r.t{border-top:1px solid var(--line);padding-top:8px;font-weight:700}
.paychips{display:flex;flex-wrap:wrap;gap:8px}
.paychips button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-weight:600;font-size:.88rem;display:flex;align-items:center;gap:7px}
.paychips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cdot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.cardlist{display:flex;flex-direction:column}
.crow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .ci2{width:40px;height:28px;border-radius:6px;position:relative}
.crow .ci2::after{content:"";position:absolute;left:6px;top:8px;width:9px;height:7px;border-radius:2px;background:rgba(255,255,255,.75)}
.crow .nm b{display:block;font-weight:600}
.crow .nm span{display:block;font-size:.8rem;color:var(--muted)}
.crow .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.crow .rt b{font-family:var(--display);font-weight:800}
.form2{padding:14px;display:flex;flex-direction:column;gap:12px}
.form2 input,.form2 select{width:100%;box-sizing:border-box}
.form2 .row2{grid-template-columns:1fr 1fr}
.due{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.due:first-child{border-top:0}
.due .dd{width:52px;height:52px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.due .dd b{font-family:var(--display);font-size:1.3rem;font-weight:800}
.due .dd small{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:3px}
.due .nm b{display:block;font-weight:600}
.due .nm span{display:block;font-size:.8rem;color:var(--muted)}
.due .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.due.paid{opacity:.6}
.chip.soon{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.late{background:color-mix(in srgb,var(--out) 16%,transparent);color:var(--out)}
.chip.paid{background:var(--save-soft);color:var(--save)}
.chip.far{background:var(--soft);color:var(--muted)}
.notifbar{padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.notifbar span{font-size:.86rem}
.del{border:0;background:none;color:var(--muted);font-size:.74rem;padding:2px 0}
.del.arm{color:var(--out);font-weight:700}

.empty{padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{color:var(--ink);font-size:1.05rem;font-weight:600}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:11px 18px;border-radius:12px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:99px;font-size:.86rem;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.donut-wrap{display:grid;grid-template-columns:1fr;justify-items:center;gap:16px;align-items:center;padding:16px}
@media (max-width:360px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.donut{position:relative;width:150px;height:150px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .ctr small{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.donut .ctr b{font-family:var(--display);font-size:.95rem;font-weight:800;max-width:84px;line-height:1.15}
.legend{display:flex;flex-direction:column;gap:8px;min-width:0;width:100%}
.legend div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:.86rem}
.legend i{width:12px;height:12px;border-radius:4px}
.legend span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-weight:700}
.legend div.top span,.legend div.top b{color:var(--ink);font-weight:800}
.bud{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.bud:first-child{border-top:0}
.bud label{font-weight:600}
.bud input{width:100%;box-sizing:border-box}
.budr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
.bud .budr input{width:120px;box-sizing:border-box}
.budr .err{min-height:0;font-size:.74rem;text-align:right}
.budamt{font-family:var(--display);font-weight:800;font-size:1.05rem;white-space:nowrap}
.budbtns{display:flex;gap:10px;align-items:center}
.mini{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.78rem;padding:6px 12px;border-radius:9px}
.mini.ghost{background:var(--soft);color:var(--ink)}
.addbud{padding:14px;display:flex;flex-direction:column;gap:12px}
.addbud select,.addbud input{width:100%;box-sizing:border-box}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}

.note{font-size:.82rem;color:var(--muted);padding-inline:4px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.9rem;line-height:1;box-shadow:0 8px 22px rgba(20,27,45,.28);z-index:6}

.scrim{position:fixed;inset:0;background:rgba(8,12,24,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto;box-sizing:border-box;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.meter i{transition:none}}
.sheet h2{font-size:1.2rem}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.03em}
.amount-in{font-family:var(--display);font-size:2rem;font-weight:800;padding:8px 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--out);font-size:.84rem;min-height:1.1em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.88rem;z-index:20}
</style></head><body>

<div class="app">
  <header class="top">
    <div class="brand">Mis Cuentas</div>
    <div class="month" aria-label="Mes">
      <button id="prevM" aria-label="Mes anterior">‹</button>
      <span id="monthLbl"></span>
      <button id="nextM" aria-label="Mes siguiente">›</button>
    </div>
  </header>

  <section class="hero" aria-label="Resumen del mes">
    <div>
      <div class="lbl">Disponible del mes</div>
      <div class="big" id="balance">S/ 0.00</div>
    </div>
    <div class="split">
      <div><span class="lbl"><span class="dot" style="background:var(--in)"></span>Ingresos</span><b id="incTot">S/ 0.00</b></div>
      <div><span class="lbl"><span class="dot" style="background:var(--out)"></span>Gastos</span><b id="expTot">S/ 0.00</b></div>
      <div class="wide" id="savTile" hidden><span class="lbl"><span class="dot" style="background:var(--save)"></span>Ahorraste este mes</span><b id="savTot">S/ 0.00</b></div>
    </div>
    <div class="meter" aria-hidden="true"><i id="meter" style="width:0%"></i></div>
    <small id="meterTxt">Registra tu primer movimiento para ver cuánto te queda.</small>
  </section>

  <main id="view"></main>
  <p class="note" id="storeNote"></p>
</div>

<button class="fab" id="fab" aria-label="Agregar movimiento" hidden>+</button>

<div class="tabs"><nav>
  <button data-tab="inicio" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-tab="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Movimientos</button>
  <button data-tab="pres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 4"/></svg>Presupuestos</button>
  <button data-tab="pagos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Pagos</button>
  <button data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
</nav></div>

<div class="scrim" id="scrim" hidden>
  <form class="sheet" id="txForm" novalidate>
    <h2 id="sheetTitle">Nuevo movimiento</h2>
    <div class="seg three" role="group" aria-label="Tipo">
      <button type="button" id="tGasto" aria-pressed="true">Gasto</button>
      <button type="button" id="tIngreso" aria-pressed="false">Ingreso</button>
      <button type="button" id="tAhorro" aria-pressed="false">Ahorro</button>
    </div>
    <div class="field"><label for="fAmt">Monto</label><input class="amount-in" id="fAmt" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
    <div class="row2">
      <div class="field" id="catBox"><label for="fCat">Categoría</label><select id="fCat"></select></div>
      <div class="field"><label for="fDate">Fecha</label><input type="date" id="fDate"></div>
    </div>
    <div class="field" id="payBox"><label>Pagado con</label>
      <div class="paychips" id="payOpts" role="group" aria-label="Pagado con"></div>
      <span class="note" id="payHint" style="padding:0"></span></div>
    <div class="field"><label for="fNote">Descripción (opcional)</label><input id="fNote" maxlength="80" placeholder="Ej. Menú del almuerzo"></div>
    <div class="err" id="fErr"></div>
    <div class="row2">
      <button type="button" class="btn ghost" id="cancel">Cancelar</button>
      <button type="submit" class="btn" id="save">Guardar</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CATS = {
  gasto: [["Comida","CO"],["Transporte","TR"],["Vivienda","VI"],["Servicios","SE"],["Salud","SA"],["Educación","ED"],["Ocio","OC"],["Compras","CM"],["Deudas","DE"],["Otros","OT"]],
  ingreso: [["Sueldo","SU"],["Freelance","FR"],["Ventas","VE"],["Regalos","RE"],["Otros ingresos","OI"]]
};
const abbr = c => ([...CATS.gasto,...CATS.ingreso].find(x=>x[0]===c)||[c,c.slice(0,2).toUpperCase()])[1];

const S = { txs: [], profile: { currency: "PEN", budgets: {} }, tab: "inicio", filter: "todos", month: null, ready:false };
const now = new Date();
S.month = new Date(now.getFullYear(), now.getMonth(), 1);
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const ym = d => d.getFullYear()+"-"+pad(d.getMonth()+1);
const fmt = v => { try { return new Intl.NumberFormat("es-PE",{style:"currency",currency:S.profile.currency||"PEN"}).format(v); } catch(e){ return v.toFixed(2); } };
const fmt0 = v => { try { return new Intl.NumberFormat("es-PE",{style:"currency",currency:S.profile.currency||"PEN",maximumFractionDigits:0}).format(v); } catch(e){ return Math.round(v)+""; } };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

/* ---------- storage: private db per person, browser storage as fallback ---------- */
const store = {
  mode: "memory", txCol: null, profRef: null,
  async init() {
    let db=null, user=null, uid=null;
    try {
      if (window.claude && window.claude.use) {
        [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
        uid = user ? await user.id() : null;
      }
    } catch(e) {}
    if (db && uid) {
      this.mode = "db";
      const base = db.doc("data/users/"+uid+"/perfil");
      this.profRef = base;
      this.txCol = base.collection("movimientos");
      this.txCol.orderBy("date","desc").limit(1000).onSnapshot(snap => {
        S.txs = snap.docs.map(d => ({ id: d.id, ...d.data() })); migrate(); S.ready = true; render();
      }, () => { $("storeNote").textContent = "Se perdió la conexión con tus datos. Recarga la página."; });
      base.onSnapshot(s => { if (s.exists) { S.profile = { currency:"PEN", budgets:{}, ...s.data() }; render(); } });
    } else {
      this.mode = "local";
      try {
        const raw = localStorage.getItem("miscuentas");
        if (raw) { const o = JSON.parse(raw); S.txs = o.txs||[]; S.profile = { currency:"PEN", budgets:{}, ...(o.profile||{}) }; if (migrate()) this.saveLocal(); }
      } catch(e) { this.mode = "memory"; }
      S.ready = true; syncNative(); render();
    }
    $("storeNote").textContent = this.mode==="db" ? "Tus datos se guardan en tu cuenta y solo tú los ves."
      : this.mode==="local" ? "Tus datos se guardan solo en este celular. Copia un respaldo desde Ajustes de vez en cuando."
      : "Este navegador no permite guardar datos: los movimientos se perderán al cerrar la página.";
  },
  saveLocal() { try { localStorage.setItem("miscuentas", JSON.stringify({ txs:S.txs, profile:S.profile })); } catch(e){} },
  async add(tx) {
    if (this.mode==="db") { await this.txCol.add(tx); }
    else { S.txs.unshift({ id: "l"+Date.now()+Math.random().toString(36).slice(2,6), ...tx }); this.saveLocal(); render(); }
  },
  async remove(id) {
    if (this.mode==="db") { await this.txCol.doc(id).delete(); }
    else { S.txs = S.txs.filter(t=>t.id!==id); this.saveLocal(); render(); }
  },
  async setProfile(p) {
    S.profile = { ...S.profile, ...p };
    if (this.mode==="db") { await this.profRef.set(S.profile); }
    else { this.saveLocal(); }
    syncNative();
    render();
  }
};

/* ---------- derived data ---------- */
const CARD_COLORS = ["#3B5BDB","#C2185B","#00897B","#E6A100","#5E35B1","#E4572E"];
function cardColor(id) { const cs = S.profile.cards||[]; const i = cs.findIndex(c=>c.id===id); return i<0 ? "#8A93AD" : (cs[i].color || CARD_COLORS[i%CARD_COLORS.length]); }
function cardLabel(t) { const c = (S.profile.cards||[]).find(x=>x.id===t.card); return c ? c.name : (t.cardName || "Tarjeta"); }
function byCardOf(list) {
  const r = {};
  for (const t of list) if (t.type==="gasto" && t.method==="tarjeta") { const k = t.card || "_none"; r[k] = (r[k]||0) + t.amount; }
  return r;
}
function migrate() {
  // Lo registrado antes como gasto en la categoría "Ahorro" pasa a ser ahorro
  let changed = false;
  for (const t of S.txs) if (t.type==="gasto" && (t.cat||"").trim().toLowerCase()==="ahorro") { t.type="ahorro"; t.cat="Ahorro"; delete t.method; changed=true; }
  const b = S.profile.budgets||{}; const key = Object.keys(b).find(k=>k.trim().toLowerCase()==="ahorro");
  if (key) { if (!S.profile.savingsGoal) S.profile.savingsGoal = b[key]; delete b[key]; changed=true; }
  if ((S.profile.customCats||[]).some(c=>c.trim().toLowerCase()==="ahorro")) { S.profile.customCats = S.profile.customCats.filter(c=>c.trim().toLowerCase()!=="ahorro"); changed=true; }
  return changed;
}
const savOf = key => S.txs.reduce((a,t)=> a + (t.type==="ahorro" && (t.date||"").startsWith(key) ? t.amount : 0), 0);
function monthData() {
  const key = ym(S.month);
  const list = S.txs.filter(t => (t.date||"").startsWith(key)).sort((a,b)=> (b.date+(b.createdAt||"")).localeCompare(a.date+(a.createdAt||"")));
  let inc=0, exp=0, sav=0, card=0, cardN=0; const byCat = {};
  for (const t of list) {
    if (t.type==="ingreso") inc += t.amount;
    else if (t.type==="ahorro") sav += t.amount;
    else { exp += t.amount; byCat[t.cat] = (byCat[t.cat]||0) + t.amount; if (t.method==="tarjeta") { card += t.amount; cardN++; } }
  }
  return { list, inc, exp, sav, byCat, card, cardN, byCard: byCardOf(list) };
}

/* ---------- rendering ---------- */
function renderHero(m) {
  const ml = S.month.toLocaleDateString("es-PE",{month:"long",year:"numeric"}).replace(/ de /i," ");
  $("monthLbl").textContent = ml.charAt(0).toUpperCase()+ml.slice(1);
  const bal = m.inc - m.exp - m.sav;
  $("savTile").hidden = !(m.sav>0); $("savTot").textContent = fmt(m.sav);
  $("balance").textContent = fmt(bal);
  $("incTot").textContent = fmt(m.inc);
  $("expTot").textContent = fmt(m.exp);
  const pct = m.inc>0 ? Math.max(0, Math.min(100, (bal/m.inc)*100)) : 0;
  $("meter").style.width = pct+"%";
  $("meter").style.background = bal<0 ? "var(--out)" : "var(--in)";
  $("meterTxt").textContent = !m.list.length ? "Aún no hay movimientos este mes."
    : m.inc===0 ? "Registra tus ingresos para ver qué parte te queda."
    : bal>=0 ? `Te queda el ${Math.round(pct)}% de lo que ingresó este mes${m.sav>0?", ya separado tu ahorro":""}.`
    : `Te pasaste ${fmt(-bal)} de lo que ingresó este mes.`;
}

function catRows(m, limit) {
  const rows = Object.entries(m.byCat).sort((a,b)=>b[1]-a[1]);
  if (!rows.length) return `<div class="empty"><h3>Sin gastos este mes</h3><span>Cuando registres un gasto verás aquí en qué se va tu dinero.</span></div>`;
  return rows.slice(0, limit||99).map(([c,v]) => {
    const b = +S.profile.budgets?.[c] || 0;
    const base = b || m.exp || 1;
    const p = Math.min(100, v/base*100);
    const st = b && v>b ? "over" : b && v>=b*.85 ? "near" : "";
    const sub = b ? `<span>${fmt(v)} de ${fmt(b)}</span>${st? `<span class="chip ${st}">${st==="over"?"Excedido":"Casi al límite"}</span>`:`<span>Quedan ${fmt(b-v)}</span>`}`
                  : `<span>${Math.round(v/(m.exp||1)*100)}% de tus gastos</span><span></span>`;
    return `<div class="cat"><div class="ico">${abbr(c)}</div><div class="nm">${esc(c)}</div><div class="amt">${fmt(v)}</div>
      <div class="bar"><i class="${st}" style="width:${p}%"></i></div><div class="sub">${sub}</div></div>`;
  }).join("");
}

function txList(list) {
  if (!list.length) return `<div class="empty"><h3>No hay movimientos</h3><span>Toca el botón + para registrar un gasto o un ingreso.</span><button class="btn" data-act="add">Agregar movimiento</button></div>`;
  let html="", day="";
  for (const t of list) {
    if (t.date!==day) {
      day = t.date;
      const d = new Date(day+"T12:00:00");
      const tot = list.filter(x=>x.date===day).reduce((s,x)=>s+(x.type==="ingreso"?x.amount:x.type==="ahorro"?0:-x.amount),0);
      html += `<div class="day"><span>${d.toLocaleDateString("es-PE",{weekday:"short",day:"numeric",month:"short"})}</span><span>${list.some(x=>x.date===day&&x.type!=="ahorro")?fmt(tot):""}</span></div>`;
    }
    if (t.type==="ahorro") {
      html += `<div class="tx"><div class="ico savico">AH</div>
      <div class="nm"><b>${esc(t.note||"Ahorro del mes")}</b><span>Ahorro</span></div>
      <div class="amt"><span class="sav">${fmt(t.amount)}</span><button class="del" data-del="${esc(t.id)}">Eliminar</button></div></div>`;
      continue;
    }
    const pos = t.type==="ingreso";
    html += `<div class="tx"><div class="ico">${abbr(t.cat)}</div>
      <div class="nm"><b>${esc(t.note||t.cat)}</b><span>${esc(t.note?t.cat:(pos?"Ingreso":"Gasto"))}${t.method==="tarjeta"?`<i class="card-tag" style="background:color-mix(in srgb,${cardColor(t.card)} 16%,transparent);color:${cardColor(t.card)}">${esc(cardLabel(t).toUpperCase())}</i>`:""}</span></div>
      <div class="amt"><span class="${pos?"pos":"neg"}">${pos?"+":"−"}${fmt(t.amount)}</span><button class="del" data-del="${esc(t.id)}">Eliminar</button></div></div>`;
  }
  return html;
}

const EXTRA_COLORS = ["#C2185B","#00897B","#5E35B1","#7CB342","#F4511E","#3949AB","#D4A017","#6D4C41"];
const catColor = c => CAT_COLORS[c] || EXTRA_COLORS[[...c].reduce((h,ch)=>(h*31+ch.charCodeAt(0))>>>0,7)%EXTRA_COLORS.length];
const expenseCats = () => [...CATS.gasto.map(x=>x[0]), ...(S.profile.customCats||[])];
function budRows(m) {
  const cats = expenseCats().filter(c => S.profile.budgets?.[c]);
  if (!cats.length) return `<div class="empty"><h3>Aún no tienes presupuestos</h3><span>Agrega uno abajo para controlar cuánto gastas en cada categoría.</span></div>`;
  return cats.map((c,i) => {
    const id = "b-"+i; const spent = m.byCat[c]||0;
    return `<div class="bud"><div class="ico" style="background:${catColor(c)};color:#fff">${esc(abbr(c))}</div>
      <label ${S.editBud===c?'for="editBudIn"':""}>${esc(c)}<br><span class="note" style="padding:0;font-weight:400">Gastado: ${fmt(spent)}</span></label>
      ${S.editBud===c
        ? `<div class="budr"><input id="editBudIn" inputmode="decimal" value="${S.profile.budgets[c]}" aria-label="Nuevo límite para ${esc(c)}">
            <div class="budbtns"><button class="del" data-cancelbud="1">Cancelar</button><button class="mini" data-savebud="${esc(c)}">Guardar</button></div>
            <span class="err" id="editBudErr"></span></div>`
        : `<div class="budr"><b class="budamt">${fmt(S.profile.budgets[c])}</b>
            <div class="budbtns"><button class="mini ghost" data-editbud="${esc(c)}">Editar</button><button class="del" data-delbud="${esc(c)}">Eliminar</button></div></div>`}</div>`;
  }).join("");
}
const CAT_COLORS = {"Comida":"#E4572E","Transporte":"#3B5BDB","Vivienda":"#8E44AD","Servicios":"#1597A8","Salud":"#E0457B","Educación":"#E6A100","Ocio":"#20A866","Compras":"#FF8C42","Deudas":"#8B5A2B","Otros":"#8A93AD"};
function donut(m) {
  const rows = Object.entries(m.byCat).sort((a,b)=>b[1]-a[1]);
  if (!rows.length) return `<div class="empty"><h3>Sin gastos este mes</h3><span>El gráfico aparecerá cuando registres tu primer gasto.</span></div>`;
  const total = m.exp || 1; let acc = 0;
  const gap = rows.length>1 ? 0.8 : 0;
  const segs = rows.map(([c,v]) => {
    const p = v/total*100;
    const seg = `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${catColor(c)}" stroke-width="6" stroke-dasharray="${Math.max(p-gap,0.01)} ${100-Math.max(p-gap,0.01)}" stroke-dashoffset="${-acc}"></circle>`;
    acc += p; return seg;
  }).join("");
  const legend = rows.map(([c,v],i) => `<div class="${i===0?"top":""}"><i style="background:${catColor(c)}"></i><span>${esc(c)}</span><b>${fmt0(v)} <small class="lp">${Math.round(v/total*100)}%</small></b></div>`).join("");
  return `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="Gastos por categoría">
      <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--soft)" stroke-width="6"></circle>${segs}</svg>
      <div class="ctr"><small>Gastado</small><b>${fmt0(m.exp)}</b></div></div>
    <div class="legend">${legend}</div></div>`;
}

function expenseBars(m) {
  const rows = Object.entries(m.byCat).sort((a,b)=>b[1]-a[1]);
  if (!rows.length) return `<div class="empty"><h3>Sin gastos este mes</h3><span>Registra tus gastos en la pestaña Movimientos y aquí verás cuál categoría pesa más.</span></div>`;
  const max = rows[0][1];
  return `<div class="hbars" aria-label="Gastos por categoría">${rows.map(([c,v],i)=>`<div class="hb ${i===0?"top":""}"><span class="l">${esc(c)}</span>
    <div class="t"><i style="width:${Math.max(v/max*72,1)}%;background:${catColor(c)}"></i><span>${fmt0(v)} · ${Math.round(v/(m.exp||1)*100)}%</span></div></div>`).join("")}</div>`;
}
function planData(m) {
  const bud = expenseCats().reduce((a,c)=>a+(+S.profile.budgets?.[c]||0),0);
  const goal = +S.profile.savingsGoal||0;
  const plan = Math.round((bud+goal)*100)/100, inc = Math.round(m.inc*100)/100;
  return { bud, goal, plan, inc, diff: Math.round((inc-plan)*100)/100 };
}
function planVerdict(d) {
  if (!d.inc) return { cls:"eq", txt:"Registra tu sueldo en Movimientos para comparar" };
  if (!d.plan) return { cls:"eq", txt:"Aún no tienes presupuestos ni meta de ahorro" };
  if (Math.abs(d.diff) < 0.01) return { cls:"down", txt:"Coincide exactamente con tus ingresos" };
  return d.diff>0 ? { cls:"ok", txt:`Te sobran ${fmt(d.diff)} sin asignar` } : { cls:"up", txt:`Tu plan supera tus ingresos en ${fmt(-d.diff)}` };
}
function planChart(m) {
  const d = planData(m), v = planVerdict(d);
  if (!d.inc || !d.plan) return `<div class="empty"><h3>${v.txt}</h3><span>Aquí verás si tus presupuestos más tu ahorro coinciden con lo que ganas.</span></div>`;
  const max = Math.max(d.inc, d.plan);
  const w = x => (x/max*100).toFixed(2)+"%";
  return `<div class="plan">
    <div class="pv"><span class="dchip ${v.cls}">${v.txt}</span></div>
    <div class="pr"><div class="ph"><b>Ingresos del mes</b><span>${fmt(d.inc)}</span></div><div class="pt"><i style="width:${w(d.inc)};background:var(--in)"></i></div></div>
    <div class="pr"><div class="ph"><b>Presupuestos + ahorro</b><span>${fmt(d.plan)}</span></div>
      <div class="pt"><i style="width:${w(d.bud)};background:var(--accent)"></i><i style="width:${w(d.goal)};background:var(--save)"></i></div></div>
    <div class="legend2"><span><i style="background:var(--accent)"></i>Presupuestos ${fmt0(d.bud)}</span><span><i style="background:var(--save)"></i>Meta de ahorro ${fmt0(d.goal)}</span></div>
  </div>`;
}
function cardChart(m) {
  const cards = S.profile.cards||[];
  const keys = [...cards.map(c=>c.id), ...Object.keys(m.byCard).filter(k=>!cards.some(c=>c.id===k))];
  if (!keys.length) return "";
  const max = Math.max(...keys.map(k=>m.byCard[k]||0), 1);
  const total = Object.values(m.byCard).reduce((a,b)=>a+b,0);
  const rows = keys.map(k => {
    const c = cards.find(x=>x.id===k); const v = m.byCard[k]||0;
    const name = c ? c.name : k==="_none" ? "Sin asignar" : (m.list.find(t=>t.card===k)?.cardName || "Tarjeta eliminada");
    return `<div class="hb"><span class="l">${esc(name)}</span><div class="t">${v?`<i style="width:${Math.max(v/max*72,1)}%;background:${cardColor(k)}"></i>`:""}<span>${fmt0(v)}</span></div></div>`;
  }).join("");
  return `<div class="sec" style="margin-top:18px"><div class="sec-h"><h2>Gasto por tarjeta</h2><span class="note">Total ${fmt0(total)}</span></div><div class="panel"><div class="hbars">${rows}</div></div></div>`;
}
function compareChart(m) {
  const pd = new Date(S.month.getFullYear(), S.month.getMonth()-1, 1), pk = ym(pd);
  const prev = {};
  for (const t of S.txs) if (t.type==="gasto" && (t.date||"").startsWith(pk)) prev[t.cat] = (prev[t.cat]||0) + t.amount;
  const pName = pd.toLocaleDateString("es-PE",{month:"long"}), cName = S.month.toLocaleDateString("es-PE",{month:"long"});
  const cats = [...new Set([...Object.keys(m.byCat), ...Object.keys(prev)])];
  if (!cats.length) return `<div class="empty"><h3>Sin gastos para comparar</h3><span>Cuando registres gastos en Movimientos verás aquí cómo cambian de un mes a otro.</span></div>`;
  if (!Object.keys(prev).length) return `<div class="empty"><h3>Sin datos de ${pName}</h3><span>No hay gastos registrados en ${pName}. El próximo mes podrás comparar ${cName} contra el mes anterior.</span></div>`;
  cats.sort((a,b)=>(m.byCat[b]||0)-(m.byCat[a]||0) || (prev[b]||0)-(prev[a]||0));
  const max = Math.max(...cats.map(c=>Math.max(m.byCat[c]||0, prev[c]||0)), 1);
  const totP = Object.values(prev).reduce((a,b)=>a+b,0), dT = m.exp - totP;
  const rows = cats.map(c => {
    const v = m.byCat[c]||0, p = prev[c]||0, d = v - p;
    const chip = d>0 ? `<span class="dchip up">▲ ${fmt0(d)}</span>` : d<0 ? `<span class="dchip down">▼ ${fmt0(-d)}</span>` : `<span class="dchip eq">igual</span>`;
    return `<div class="cmp"><div class="ch"><b>${esc(c)}</b>${chip}</div>
      <div class="cb">${v?`<i style="width:${Math.max(v/max*78,1)}%;background:${catColor(c)}"></i>`:""}<span>${fmt0(v)}</span></div>
      <div class="cb prev">${p?`<i style="width:${Math.max(p/max*78,1)}%"></i>`:""}<span>${fmt0(p)}</span></div></div>`;
  }).join("");
  return `<div class="cmpw">
    <div class="cmpsum">En total gastaste <b>${fmt0(m.exp)}</b> en ${cName}${dT>0?`, <b class="neg">${fmt0(dT)} más</b> que`:dT<0?`, <b class="pos">${fmt0(-dT)} menos</b> que`:", lo mismo que"} en ${pName}.</div>
    ${rows}
    <div class="legend2"><span><i style="background:var(--ink)"></i>${cName.charAt(0).toUpperCase()+cName.slice(1)}</span><span><i style="background:var(--line)"></i>${pName.charAt(0).toUpperCase()+pName.slice(1)}</span><span>▲ gastaste más</span><span>▼ gastaste menos</span></div></div>`;
}
function budgetChart(m) {
  const cats = expenseCats().filter(c => S.profile.budgets?.[c]);
  if (!cats.length) return `<div class="empty"><h3>Sin presupuestos</h3><span>Define límites por categoría para ver aquí cuánto llevas usado.</span><button class="btn ghost" data-go="pres">Ir a Presupuestos</button></div>`;
  const rows = cats.map(c => { const b=+S.profile.budgets[c], v=m.byCat[c]||0; return {c,b,v,p:v/b*100}; }).sort((a,b)=>b.p-a.p);
  return `<div class="bchart">${rows.map(r=>{ const st = r.p>100?"over":r.p>=85?"near":"";
    return `<div class="bc"><div class="h"><b>${esc(r.c)}</b><span>${fmt0(r.v)} de ${fmt0(r.b)}</span></div>
      <div class="track"><i class="${st}" style="width:${Math.min(r.p,100)}%"></i></div>
      <div class="pct ${st}">${Math.round(r.p)}% usado${st==="over"?` · te pasaste ${fmt0(r.v-r.b)}`:st==="near"?(r.p>=100?" · límite alcanzado":" · casi al límite"):` · quedan ${fmt0(r.b-r.v)}`}</div></div>`;}).join("")}
    <div class="legend2"><span><i style="background:var(--in)"></i>Bien</span><span><i style="background:var(--warn)"></i>85% o más</span><span><i style="background:var(--out)"></i>Excedido</span></div></div>`;
}
function savingsPanel(m) {
  const goal = +S.profile.savingsGoal || 0;
  const total = S.txs.reduce((a,t)=>a+(t.type==="ahorro"?t.amount:0),0);
  const months = [];
  for (let i=5;i>=0;i--) { const d = new Date(S.month.getFullYear(), S.month.getMonth()-i, 1); months.push({ d, v: savOf(ym(d)) }); }
  const max = Math.max(goal, ...months.map(x=>x.v), 1);
  const p = goal ? Math.min(100, m.sav/goal*100) : (m.sav>0?100:0);
  const msg = !goal ? `<span>Define tu meta mensual en Presupuestos.</span>`
    : m.sav>=goal ? `<span>${fmt(m.sav)} de ${fmt(goal)}</span><span class="chip ok">¡Meta cumplida!</span>`
    : m.sav>0 ? `<span>${fmt(m.sav)} de ${fmt(goal)}</span><span>Faltan ${fmt(goal-m.sav)}</span>`
    : `<span>Meta: ${fmt(goal)}</span><span>Aún no registras tu ahorro</span>`;
  const cols = months.map((x,i)=>`<div class="mcol ${i===5?"cur":""}"><span class="v">${x.v?fmt0(x.v):""}</span><div class="b" style="height:${Math.max(x.v/max*100,2)}%"></div><span class="m">${x.d.toLocaleDateString("es-PE",{month:"short"}).replace(".","")}</span></div>`).join("");
  return `<div class="panel savp">
    <div class="savtop"><div><small>Ahorro de ${S.month.toLocaleDateString("es-PE",{month:"long"})}</small><div class="big">${fmt(m.sav)}</div></div>
      <div class="acc"><small>Total ahorrado</small><b>${fmt(total)}</b></div></div>

    ${m.sav>0?"":`<p class="note" style="margin:0;padding:0">Registra tu ahorro en la pestaña Movimientos con el botón + Ahorro.</p>`}
  </div>`;
}

const MES = ["ene","feb","mar","abr","may","jun","jul","ago","set","oct","nov","dic"];
function payItems() {
  const cards = (S.profile.cards||[]).filter(c=>c.day).map(c=>({ id:"card-"+c.id, name:c.name, day:+c.day, before:+(c.before||3), amount:0, kind:"card", ref:c.id }));
  const rems = (S.profile.reminders||[]).map(r=>({ id:r.id, name:r.name, day:+r.day, before:+(r.before||3), amount:+r.amount||0, kind:"rem" }));
  return [...cards, ...rems];
}
function dueInfo(it) {
  const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const ymNow = ym(today); const paid = (S.profile.paid||{})[it.id] === ymNow;
  const dim = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
  let due = new Date(today.getFullYear(), today.getMonth(), Math.min(it.day, dim));
  let left = Math.round((due - today)/86400000);
  let st, label;
  if (paid) {
    const nd = new Date(today.getFullYear(), today.getMonth()+1, 1); const ndim = new Date(nd.getFullYear(), nd.getMonth()+1, 0).getDate();
    due = new Date(nd.getFullYear(), nd.getMonth(), Math.min(it.day, ndim)); left = Math.round((due - today)/86400000);
    st = "paid"; label = "Pagado este mes";
  } else if (left < 0) { st = "late"; label = `Venció hace ${-left} ${left===-1?"día":"días"}`; }
  else if (left === 0) { st = "late"; label = "Vence hoy"; }
  else if (left === 1) { st = "soon"; label = "Vence mañana"; }
  else if (left <= it.before) { st = "soon"; label = `Vence en ${left} días`; }
  else { st = "far"; label = `En ${left} días`; }
  return { due, left, st, label, paid, ym: ymNow };
}
function syncNative() {
  try {
    if (!window.AndroidApp) return;
    const items = payItems().map(it => ({ id: it.id, name: it.kind==="card" ? "Tarjeta "+it.name : it.name, day: it.day, before: it.before,
      amount: it.amount ? fmt(it.amount) : "", paid: (S.profile.paid||{})[it.id] || "" }));
    window.AndroidApp.setReminders(JSON.stringify(items));
  } catch(e) {}
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab) { S.tab=b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x=>{ if(x===b) x.setAttribute("aria-current","page"); else x.removeAttribute("aria-current"); }); render(); window.scrollTo(0,0); }
  else if (b.dataset.go) { document.querySelector(`.tabs button[data-tab="${b.dataset.go}"]`).click(); }
  else if (b.dataset.filter) { S.filter=b.dataset.filter; render(); }
  else if (b.dataset.act==="add") openSheet();
  else if (b.dataset.new) { openSheet(b.dataset.new); if (b.dataset.new==="ahorro" && S.profile.savingsGoal && !monthData().sav) $("fAmt").value = S.profile.savingsGoal; }
  else if (b.dataset.act==="addsav") { openSheet("ahorro"); if (S.profile.savingsGoal) $("fAmt").value = S.profile.savingsGoal; }
  else if (b.dataset.del) {
    if (!b.classList.contains("arm")) { b.classList.add("arm"); b.textContent="¿Eliminar?"; setTimeout(()=>{ if(b.isConnected){b.classList.remove("arm"); b.textContent="Eliminar";} },3000); return; }
    try { await store.remove(b.dataset.del); toast("Movimiento eliminado"); } catch(err){ toast("No se pudo eliminar. Intenta de nuevo."); }
  }
  else if (b.dataset.pg) {
    const a = b.dataset.pg, id = b.dataset.id;
    const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    if (a==="notif") { try { window.AndroidApp.requestNotif(); } catch(e){} }
    else if (a==="paid" || a==="unpaid") {
      const paid = { ...(S.profile.paid||{}) };
      if (a==="paid") paid[id] = ym(new Date()); else delete paid[id];
      await store.setProfile({ paid }); toast(a==="paid"?"Marcado como pagado":"Pago desmarcado");
    }
    else if (a==="cardnew") { S.pgEdit="card:new"; render(); $("cfName")?.focus(); }
    else if (a==="cardedit") { S.pgEdit="card:"+id; render(); $("cfName")?.focus(); }
    else if (a==="cardcancel" || a==="remcancel") { S.pgEdit=null; render(); }
    else if (a==="cardsave") {
      const name = $("cfName").value.trim().replace(/\s+/g," ");
      if (!name) { $("cfErr").textContent="Escribe el nombre de la tarjeta."; $("cfName").focus(); return; }
      const cards = [...(S.profile.cards||[])];
      if (cards.some(c=>c.id!==id && c.name.toLowerCase()===name.toLowerCase())) { $("cfErr").textContent="Ya tienes una tarjeta con ese nombre."; return; }
      const data = { name, day:+$("cfDay").value, before:+$("cfBefore").value };
      if (id) { const i = cards.findIndex(c=>c.id===id); cards[i] = { ...cards[i], ...data }; } else cards.push({ id:newId(), ...data });
      S.pgEdit=null; await store.setProfile({ cards }); toast(id?"Tarjeta actualizada":"Tarjeta agregada");
    }
    else if (a==="carddel") {
      if (!b.classList.contains("arm")) { b.classList.add("arm"); b.textContent="¿Eliminar?"; setTimeout(()=>{ if(b.isConnected){b.classList.remove("arm"); b.textContent="Eliminar";} },3000); return; }
      const c = (S.profile.cards||[]).find(x=>x.id===id);
      if (c) for (const t of S.txs) if (t.card===id && !t.cardName) t.cardName = c.name;
      const paid = { ...(S.profile.paid||{}) }; delete paid["card-"+id];
      await store.setProfile({ cards:(S.profile.cards||[]).filter(x=>x.id!==id), paid }); toast("Tarjeta eliminada");
    }
    else if (a==="remnew") { S.pgEdit="rem:new"; render(); $("rfName")?.focus(); }
    else if (a==="remedit") { S.pgEdit="rem:"+id; render(); $("rfName")?.focus(); }
    else if (a==="remsave") {
      const name = $("rfName").value.trim().replace(/\s+/g," ");
      if (!name) { $("rfErr").textContent="Escribe qué pagas, por ejemplo Alquiler."; $("rfName").focus(); return; }
      const raw = $("rfAmt").value.trim(); const amt = raw ? Math.round(parseFloat(raw.replace(",","."))*100)/100 : 0;
      if (raw && !(amt>0)) { $("rfErr").textContent="El monto debe ser mayor que cero, o déjalo vacío."; return; }
      const rems = [...(S.profile.reminders||[])];
      const data = { name, day:+$("rfDay").value, before:+$("rfBefore").value, amount: amt };
      if (id) { const i = rems.findIndex(r=>r.id===id); rems[i] = { ...rems[i], ...data }; } else rems.push({ id:"r"+newId(), ...data });
      S.pgEdit=null; await store.setProfile({ reminders: rems }); toast(id?"Pago actualizado":"Pago agregado");
    }
    else if (a==="remdel") {
      if (!b.classList.contains("arm")) { b.classList.add("arm"); b.textContent="¿Eliminar?"; setTimeout(()=>{ if(b.isConnected){b.classList.remove("arm"); b.textContent="Eliminar";} },3000); return; }
      const paid = { ...(S.profile.paid||{}) }; delete paid[id];
      await store.setProfile({ reminders:(S.profile.reminders||[]).filter(r=>r.id!==id), paid }); toast("Pago eliminado");
    }
  }
  else if (b.dataset.goal==="edit") { S.editGoal = true; render(); const i=$("goalIn"); if(i){ i.focus(); i.select(); } }
  else if (b.dataset.goal==="cancel") { S.editGoal = false; render(); }
  else if (b.dataset.goal==="save") {
    const n = Math.round(parseFloat(($("goalIn").value||"").replace(",","."))*100)/100;
    if (!(n>0)) { $("goalErr").textContent="Escribe un monto mayor que cero"; $("goalIn").focus(); return; }
    S.editGoal = false; await store.setProfile({ savingsGoal: n }); toast("Meta de ahorro actualizada");
  }
  else if (b.dataset.goal==="del") {
    if (!b.classList.contains("arm")) { b.classList.add("arm"); b.textContent="¿Eliminar?"; setTimeout(()=>{ if(b.isConnected){b.classList.remove("arm"); b.textContent="Eliminar";} },3000); return; }
    await store.setProfile({ savingsGoal: 0 }); toast("Meta de ahorro eliminada");
  }
  else if (b.dataset.editbud) { S.editBud = b.dataset.editbud; render(); const i=$("editBudIn"); if(i){ i.focus(); i.select(); } }
  else if (b.dataset.cancelbud) { S.editBud = null; render(); }
  else if (b.dataset.savebud) {
    const c = b.dataset.savebud;
    const n = Math.round(parseFloat(($("editBudIn").value||"").replace(",","."))*100)/100;
    if (!(n>0)) { $("editBudErr").textContent="Escribe un monto mayor que cero"; $("editBudIn").focus(); return; }
    S.editBud = null;
    await store.setProfile({ budgets: { ...(S.profile.budgets||{}), [c]: n } });
    toast("Presupuesto actualizado");
  }
  else if (b.dataset.delbud) {
    if (!b.classList.contains("arm")) { b.classList.add("arm"); b.textContent="¿Eliminar?"; setTimeout(()=>{ if(b.isConnected){b.classList.remove("arm"); b.textContent="Eliminar";} },3000); return; }
    const c = b.dataset.delbud; const budgets = { ...(S.profile.budgets||{}) }; delete budgets[c];
    const p = { budgets };
    if ((S.profile.customCats||[]).includes(c) && !S.txs.some(t=>t.cat===c)) p.customCats = S.profile.customCats.filter(x=>x!==c);
    await store.setProfile(p); toast("Presupuesto eliminado");
  }
  else if (b.id==="nbAdd") {
    const sel = $("nbCat").value; const isNew = sel==="__new";
    const name = isNew ? $("nbName").value.trim().replace(/\s+/g," ") : sel;
    const amt = Math.round(parseFloat(($("nbAmt").value||"").replace(",","."))*100)/100;
    const all = [...expenseCats(), ...CATS.ingreso.map(x=>x[0])].map(x=>x.toLowerCase());
    if (isNew && !name) { $("nbErr").textContent="Escribe el nombre de la categoría."; $("nbName").focus(); return; }
    if (isNew && all.includes(name.toLowerCase())) { $("nbErr").textContent="Ya existe una categoría con ese nombre. Elígela de la lista."; return; }
    if (!(amt>0)) { $("nbErr").textContent="Escribe un límite mayor que cero."; $("nbAmt").focus(); return; }
    const p = { budgets: { ...(S.profile.budgets||{}), [name]: amt } };
    if (isNew) p.customCats = [...(S.profile.customCats||[]), name];
    await store.setProfile(p); toast("Presupuesto agregado");
  }
  else if (b.id==="impBtn") { $("impBox").hidden=false; $("impTxt").focus(); }
  else if (b.id==="impGo") {
    try {
      const o = JSON.parse($("impTxt").value);
      if (!Array.isArray(o.txs)) throw 0;
      S.txs = o.txs.filter(t=>t && t.amount>0 && t.date); S.profile = { currency:"PEN", budgets:{}, ...(o.profile||{}) }; migrate();
      store.saveLocal(); render(); toast("Respaldo restaurado");
    } catch(err) { toast("Ese texto no es un respaldo válido"); }
  }
  else if (b.id==="exp") {
    const txt = JSON.stringify({ txs:S.txs, profile:S.profile });
    const ta = $("expTxt"); ta.value = txt; ta.hidden=false;
    try { await navigator.clipboard.writeText(txt); toast("Respaldo copiado"); } catch(err){ ta.select(); toast("Selecciona y copia el texto"); }
  }
});
$("prevM").onclick = () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth()-1, 1); render(); };
$("nextM").onclick = () => { S.month = new Date(S.month.getFullYear(), S.month.getMonth()+1, 1); render(); };

document.addEventListener("keydown", e => {
  if (e.target.id==="editBudIn" && e.key==="Enter") { e.preventDefault(); document.querySelector("[data-savebud]")?.click(); }
  if (e.target.id==="editBudIn" && e.key==="Escape") { S.editBud = null; render(); }
  if (e.target.id==="goalIn" && e.key==="Enter") { e.preventDefault(); document.querySelector('[data-goal="save"]')?.click(); }
  if (e.target.id==="goalIn" && e.key==="Escape") { S.editGoal = false; render(); }
});
document.addEventListener("change", e => {
  if (e.target.id==="nbCat") { $("nbNameBox").hidden = e.target.value!=="__new"; if (e.target.value==="__new") $("nbName").focus(); } if (e.target.id==="cur") store.setProfile({ currency:e.target.value }); });

/* ---------- add sheet ---------- */
let curType = "gasto", curPay = "efectivo";
function payOptions() {
  const cards = S.profile.cards||[];
  return [["efectivo","Efectivo / débito"], ...(cards.length ? cards.map(c=>["card:"+c.id, c.name]) : [["tarjeta","Tarjeta de crédito"]])];
}
function setPay(p) {
  curPay = p;
  $("payOpts").innerHTML = payOptions().map(([k,l])=>`<button type="button" data-pay="${esc(k)}" aria-pressed="${k===p}">${k==="efectivo"?"":'<i class="cdot" style="background:'+cardColor(k.slice(5))+'"></i>'}${esc(l)}</button>`).join("");
  $("payHint").textContent = (S.profile.cards||[]).length ? "" : "Agrega tus tarjetas en la pestaña Pagos para separar el gasto de cada una.";
}
function setType(t) {
  curType = t;
  $("tGasto").setAttribute("aria-pressed", t==="gasto"); $("tIngreso").setAttribute("aria-pressed", t==="ingreso"); $("tAhorro").setAttribute("aria-pressed", t==="ahorro");
  $("catBox").hidden = t==="ahorro";
  $("fNote").placeholder = t==="ahorro" ? "Ej. Ahorro de "+S.month.toLocaleDateString("es-PE",{month:"long"}) : "Ej. Menú del almuerzo";
  $("payBox").hidden = t!=="gasto";
  $("fCat").innerHTML = (t==="ingreso" ? CATS.ingreso.map(x=>x[0]) : expenseCats()).map(c=>`<option>${esc(c)}</option>`).join("");
}
function openSheet(type) {
  setType(["ahorro","ingreso"].includes(type)?type:"gasto"); setPay("efectivo"); $("fAmt").value=""; $("fNote").value=""; $("fErr").textContent="";
  const today = new Date(); const inMonth = ym(today)===ym(S.month);
  $("fDate").value = inMonth ? ymd(today) : ymd(S.month);
  $("scrim").hidden=false; setTimeout(()=>$("fAmt").focus(),50);
}
const closeSheet = () => { $("scrim").hidden=true; };
$("fab").onclick = () => openSheet();
$("fab").hidden = true;
$("cancel").onclick = closeSheet;
$("scrim").addEventListener("click", e => { if (e.target.id==="scrim") closeSheet(); });
$("tGasto").onclick = () => setType("gasto");
$("tIngreso").onclick = () => setType("ingreso");
$("tAhorro").onclick = () => setType("ahorro");
$("payOpts").addEventListener("click", e => { const b = e.target.closest("[data-pay]"); if (b) setPay(b.dataset.pay); });
$("txForm").addEventListener("submit", async e => {
  e.preventDefault();
  const amount = Math.round(parseFloat(($("fAmt").value||"").replace(/[^\d.,]/g,"").replace(",","."))*100)/100;
  if (!(amount>0)) { $("fErr").textContent="Escribe un monto mayor que cero."; $("fAmt").focus(); return; }
  if (!$("fDate").value) { $("fErr").textContent="Elige una fecha."; return; }
  const tx = { type:curType, amount, cat: curType==="ahorro" ? "Ahorro" : $("fCat").value, date:$("fDate").value, note:$("fNote").value.trim(), createdAt:new Date().toISOString() };
  if (curType==="gasto") {
    if (curPay.startsWith("card:")) { const c = (S.profile.cards||[]).find(x=>x.id===curPay.slice(5)); tx.method="tarjeta"; tx.card=c?.id; tx.cardName=c?.name; }
    else tx.method = curPay;
  }
  $("save").disabled = true;
  try {
    await store.add(tx);
    const [y,mo] = tx.date.split("-").map(Number); S.month = new Date(y, mo-1, 1);
    closeSheet(); render(); toast(curType==="ahorro"?"¡Ahorro registrado!":curType==="ingreso"?"Ingreso guardado":curPay!=="efectivo"?"Gasto con tarjeta guardado":"Gasto guardado");
  } catch(err) { $("fErr").textContent = err?.code==="quota_exceeded" ? "Ya no hay espacio para más movimientos. Elimina algunos antiguos." : "No se pudo guardar. Revisa tu conexión e intenta de nuevo."; }
  $("save").disabled = false;
});

let tt;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2200); }

document.addEventListener("visibilitychange", () => { if (!document.hidden && S.ready) render(); });
render();
store.init();
</script>
</body></html>
