plugins {
    id 'com.android.application'
}

android {
    namespace 'pe.miscuentas.app'
    compileSdk 34

    defaultConfig {
        applicationId 'pe.miscuentas.app'
        minSdk 26
        targetSdk 34
        versionCode 14
        versionName '2.0'
    }

    signingConfigs {
        fija {
            storeFile file('miscuentas.jks')
            storePassword 'miscuentas123'
            keyAlias 'miscuentas'
            keyPassword 'miscuentas123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fija }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fija
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.core:core:1.13.1'
}
